<html lang="tr">
<head>

<style>
/* Düzen: tek sütun, telefon öncelikli; üstte harita, altta işlem alanı. */
:root{
  --zemin:#F3F5F4; --kart:#FFFFFF; --murekkep:#12211E; --soluk:#4F5F5B; --cizgi:#D5DCDA; --cizgi-koyu:#7C8B87;
  --turuncu:#B8410B; --yesil:#0E6B63; --acik-yesil:#E1E8E5; --hata:#A12B1F;
  --baslik:'Space Grotesk',system-ui,sans-serif; --govde:Inter,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font-family:var(--govde);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.ic{padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;flex:1}
.ust-bosluk{padding-top:calc(28px + env(safe-area-inset-top))}
h1,h2,h3{font-family:var(--baslik);font-weight:700;margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.soluk{color:var(--soluk);font-size:14px}
.kucuk{font-size:13px}
.ust-yazi{font-size:13px;font-weight:600;color:var(--soluk);letter-spacing:.04em;text-transform:uppercase}
.yesil-yazi{color:var(--yesil);font-weight:600}
.hata-yazi{color:var(--hata);font-weight:600;font-size:14px}
.sutun{display:flex;flex-direction:column;gap:10px}
.satir{display:flex;align-items:center;gap:10px}
.arasi{justify-content:space-between}
.sar{flex-wrap:wrap}
.buyu{flex:1;min-width:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--yesil);outline-offset:2px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--murekkep);background:transparent;color:var(--murekkep);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ana{background:var(--turuncu);border-color:var(--turuncu);color:#fff}
.btn.yesil{background:var(--yesil);border-color:var(--yesil);color:#fff}
.btn.buyuk{min-height:56px;font-size:17px;border-radius:16px}
.btn.dar{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.tam{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.yazi-btn{min-height:44px;padding:0 6px;border:none;background:transparent;color:var(--murekkep);font-size:15px;font-weight:600;text-decoration:underline}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid #B9C4C1;background:#fff;color:var(--murekkep);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--murekkep);border-color:var(--murekkep);color:#fff}
.chip.kare{border-radius:12px;font-family:var(--baslik);font-weight:700;font-size:17px;padding:0;min-height:52px}
.izgara{display:grid;gap:8px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:16px}
.kart.koyu{background:var(--murekkep);border-color:var(--murekkep);color:#fff}
.kart.koyu .soluk{color:#C9DFD1}
.kart.kesik{background:transparent;border:1.5px dashed var(--cizgi-koyu)}
.rozet{display:inline-block;padding:6px 10px;border-radius:14px;background:var(--murekkep);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.rozet.acik{background:var(--acik-yesil);color:var(--murekkep)}
label{font-size:14px;font-weight:600}
input,select{font-family:inherit;font-size:16px;height:48px;width:100%;padding:0 14px;border-radius:12px;border:1.5px solid var(--cizgi-koyu);background:#fff;color:var(--murekkep)}
.alan{display:flex;flex-direction:column;gap:6px}
.sekmeler{display:grid;gap:4px;padding:4px;border-radius:16px;background:var(--acik-yesil)}
.sekmeler button{height:44px;padding:0;border-radius:12px;border:none;background:transparent;color:#33433F;font-size:14px;font-weight:600}
.sekmeler button[aria-pressed="true"]{background:#fff;color:var(--murekkep)}
.harita{height:38vh;min-height:220px;max-height:340px;background:#E1E8E5;position:relative;z-index:0}
.harita.kisa{height:26vh;min-height:180px}
.harita-ust{position:absolute;z-index:500;top:calc(12px + env(safe-area-inset-top));right:12px}
.harita-sol{position:absolute;z-index:500;top:calc(12px + env(safe-area-inset-top));left:12px}
.yuvarlak{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #fff;background:var(--murekkep);color:#fff;font-size:14px;font-weight:600}
.yuvarlak.beyaz{background:#fff;color:var(--murekkep);border-color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pin{background:var(--murekkep);color:#fff;border:2px solid #fff;border-radius:22px;font-family:var(--baslik);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.nokta{background:var(--yesil);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(14,107,99,.2)}
.kafe-nokta{background:var(--turuncu);border:2px solid #fff;border-radius:50%}
.oran-kutu{width:64px;height:64px;flex-shrink:0;border-radius:14px;background:var(--yesil);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--baslik);font-weight:700;font-size:22px}
.oran-yazi{font-family:var(--baslik);font-weight:700;font-size:24px;color:var(--turuncu)}
.kod{font-family:var(--baslik);font-weight:700;font-size:44px;letter-spacing:.14em;text-align:center}
.sayac{display:flex;align-items:center;gap:14px}
.sayac button{width:44px;height:44px;border-radius:22px;border:1.5px solid #B9C4C1;background:#fff;color:var(--murekkep);font-size:22px;line-height:1}
.sayac span{font-family:var(--baslik);font-weight:700;font-size:24px;min-width:22px;text-align:center}
.menu-satir{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--acik-yesil)}
.menu-satir:last-child{border-bottom:none}
.fiyat{font-family:var(--baslik);font-weight:700;font-size:17px;white-space:nowrap}
.fiyat.indirimli{color:var(--turuncu)}
ol.adimlar{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));background:var(--murekkep);color:#fff;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:500;z-index:2000;display:none}
#toast.hata{background:var(--hata)}
.yukleniyor{flex:1;display:flex;align-items:center;justify-content:center;color:var(--soluk)}
.leaflet-container{font-family:var(--govde)}
</style>
</head>
<body>
<div id="app"><div class="yukleniyor">Yükleniyor…</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
const SUPA_URL = 'https://oeapprlxcipkjbfoilcm.supabase.co';
const SUPA_KEY = 'sb_publishable_ol7ux6gb9ajfh7ux-_G_Tg_p_LfsAC9';
const KOD_UCRETI = 10;
const YARICAP = 1500;
const KAPSAMLAR = ['Yemek', 'İçecek', 'Tatlı', 'Yemek + içecek', 'Tüm menü'];
const KAPSAM_KATEGORI = {
  'Yemek': ['Yemek'], 'İçecek': ['İçecek'], 'Tatlı': ['Tatlı'],
  'Yemek + içecek': ['Yemek', 'İçecek'], 'Tüm menü': ['Yemek', 'İçecek', 'Tatlı']
};

const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const app = document.getElementById('app');

const S = {
  session: null, profil: null, kafe: null, view: 'yukleniyor',
  giris: { mod: 'giris', rol: 'musteri', hata: '', bilgi: '' },
  konum: null, konumGps: false,
  f: { kapsam: 'Tüm menü', kisi: 2, oran: 20 },
  talep: null, teklifler: [], menuTeklif: null, kod: null,
  sekme: 'talepler', karsi: null, kodSonuc: null,
  basvuru: { lat: null, lng: null }
};

/* ---------- yardımcılar ---------- */
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tl = (n) => new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 2 }).format(Number(n)) + ' TL';
const $ = (s) => document.querySelector(s);
const uid = () => S.session && S.session.user.id;

function mesafe(lat1, lng1, lat2, lng2) {
  const r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLng / 2) ** 2;
  return 6371000 * 2 * Math.asin(Math.min(1, Math.sqrt(a)));
}
function mesafeYazi(m) {
  const dk = Math.max(1, Math.round(m / 80));
  return (m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km') + ' · ' + dk + ' dk yürüme';
}
function kalanDk(ts) { return Math.max(0, Math.ceil((new Date(ts).getTime() - Date.now()) / 60000)); }

let toastT = null;
function toast(msg, hata) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = hata ? 'hata' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, hata ? 5000 : 3000);
}

function cevir(msg) {
  const m = String(msg || '');
  if (/Invalid login credentials/i.test(m)) return 'E-posta ya da şifre yanlış.';
  if (/already registered|already been registered/i.test(m)) return 'Bu e-posta ile zaten bir üyelik var. Giriş yapmayı dene.';
  if (/Email not confirmed/i.test(m)) return 'E-postanı henüz onaylamadın. Gelen kutundaki bağlantıya dokun, sonra giriş yap.';
  if (/Password should be/i.test(m)) return 'Şifre en az 8 karakter olmalı.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar dene.';
  if (/valid email|invalid format/i.test(m)) return 'E-posta adresini kontrol et.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol et.';
  if (/duplicate key/i.test(m)) return 'Bu kayıt zaten var.';
  if (/row-level security|permission denied/i.test(m)) return 'Bu işlem için yetkin yok.';
  return m || 'Bir sorun oluştu.';
}
async function q(sorgu) {
  const { data, error } = await sorgu;
  if (error) throw new Error(cevir(error.message));
  return data;
}

/* ---------- konum ve harita ---------- */
function konumAl() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Bu cihaz konum vermiyor.'));
    navigator.geolocation.getCurrentPosition(
      (p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      (e) => rej(new Error(e.code === 1 ? 'Konum izni verilmedi.' : 'Konum alınamadı.')),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  });
}
let map = null, katman = null;
function haritaKur(id, lat, lng, zoom) {
  haritaSil();
  if (!window.L || !document.getElementById(id)) return null;
  map = L.map(id, { zoomControl: false }).setView([lat, lng], zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  katman = L.layerGroup().addTo(map);
  return map;
}
function haritaSil() { if (map) { map.remove(); map = null; katman = null; } }
const benIkon = () => L.divIcon({ className: '', html: '<div class="nokta" style="width:18px;height:18px"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
const kafeIkon = () => L.divIcon({ className: '', html: '<div class="kafe-nokta" style="width:14px;height:14px"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
const oranIkon = (oran) => L.divIcon({ className: '', html: '<div class="pin" style="width:56px;height:36px">%' + Number(oran) + '</div>', iconSize: [56, 36], iconAnchor: [28, 18] });

/* ---------- yenileme döngüsü ---------- */
let dongu = null, donguNo = 0;
function tekrarla(fn, ms) {
  dur();
  const no = ++donguNo;
  let calisiyor = false;
  const tur = async () => {
    if (calisiyor || no !== donguNo) return;
    calisiyor = true;
    try { await fn(() => no === donguNo); } catch (e) { console.warn(e); }
    calisiyor = false;
  };
  tur();
  dongu = setInterval(tur, ms);
}
function dur() { donguNo++; if (dongu) { clearInterval(dongu); dongu = null; } }

/* ---------- çizim ---------- */
function git(view) { S.view = view; ciz(); }
function ciz() {
  dur(); haritaSil();
  const v = EKRAN[S.view] || EKRAN.giris;
  app.innerHTML = v.html();
  window.scrollTo(0, 0);
  if (v.kur) v.kur();
}
function secimiGuncelle(grup, deger) {
  document.querySelectorAll('[data-g="' + grup + '"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === String(deger))));
}
const chipler = (grup, liste, secili, sinif, yazi) => liste.map((v) =>
  '<button type="button" class="chip ' + (sinif || '') + '" data-a="sec" data-g="' + grup + '" data-v="' + esc(v) + '" aria-pressed="' + (String(v) === String(secili)) + '">' + esc(yazi ? yazi(v) : v) + '</button>').join('');

function kurulumKarti() {
  const tam = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (tam) return '';
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const adimlar = ios
    ? ['Safari’de Paylaş’a bas (alttaki ••• menüsünün içinde olabilir).', '“Ana Ekrana Ekle”yi seç.', 'Sağ üstten “Ekle”ye bas.']
    : ['Tarayıcının sağ üstündeki üç noktaya bas.', '“Ana ekrana ekle” ya da “Uygulamayı yükle”yi seç.', '“Ekle”ye bas.'];
  return '<div class="kart sutun"><h3>Telefonuna uygulama gibi ekle</h3><p class="soluk">Ana ekranda kendi simgesiyle, tam ekran açılır.</p><ol class="adimlar">' +
    adimlar.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ol></div>';
}

const EKRAN = {};

/* ---------- giriş ve üyelik ---------- */
EKRAN.giris = {
  html() {
    const g = S.giris, uye = g.mod === 'uye', isl = g.rol === 'isletme';
    return '<div class="ic ust-bosluk">' +
      '<div class="sutun"><span class="ust-yazi">BENDENSİN</span><h1>' + (uye ? 'Üye ol' : 'Giriş yap') + '</h1>' +
      '<p class="soluk">Yakındaki kafelerden menü fiyatları üzerinden indirim teklifi al.</p></div>' +
      '<div class="sekmeler" style="grid-template-columns:1fr 1fr">' +
        '<button type="button" data-a="giris-mod" data-v="giris" aria-pressed="' + !uye + '">Giriş yap</button>' +
        '<button type="button" data-a="giris-mod" data-v="uye" aria-pressed="' + uye + '">Üye ol</button></div>' +
      (uye ? '<div class="sutun"><span style="font-size:14px;font-weight:600">Hesap türü</span><div class="izgara" style="grid-template-columns:1fr 1fr">' +
        '<button type="button" class="chip" data-a="giris-rol" data-v="musteri" aria-pressed="' + !isl + '">Müşteriyim</button>' +
        '<button type="button" class="chip" data-a="giris-rol" data-v="isletme" aria-pressed="' + isl + '">İşletmeyim</button></div></div>' : '') +
      '<form id="giris-form" class="sutun" style="gap:14px" novalidate>' +
        (uye ? '<div class="alan"><label for="g-ad">' + (isl ? 'Yetkili adı soyadı' : 'Ad soyad') + '</label><input id="g-ad" type="text" autocomplete="name" maxlength="80"></div>' +
               '<div class="alan"><label for="g-tel">Telefon numarası</label><input id="g-tel" type="tel" autocomplete="tel" placeholder="05xx xxx xx xx" maxlength="20"></div>' : '') +
        '<div class="alan"><label for="g-eposta">E-posta</label><input id="g-eposta" type="email" autocomplete="email" inputmode="email"></div>' +
        '<div class="alan"><label for="g-sifre">Şifre</label><input id="g-sifre" type="password" autocomplete="' + (uye ? 'new-password' : 'current-password') + '"></div>' +
        (uye ? '<p class="soluk kucuk">Şifren en az 8 karakter olmalı.' + (isl ? ' İşletme bilgilerini bir sonraki adımda gireceksin.' : '') + '</p>' : '') +
        (g.hata ? '<p class="hata-yazi" role="alert">' + esc(g.hata) + '</p>' : '') +
        (g.bilgi ? '<p class="yesil-yazi" role="status">' + esc(g.bilgi) + '</p>' : '') +
        '<button type="submit" class="btn ana buyuk tam">' + (uye ? 'Üye ol' : 'Giriş yap') + '</button>' +
      '</form>' + kurulumKarti() + '</div>';
  },
  kur() {
    $('#giris-form').addEventListener('submit', (e) => { e.preventDefault(); calistir(girisGonder, e.submitter); });
  }
};
async function girisGonder() {
  const g = S.giris, uye = g.mod === 'uye';
  const eposta = $('#g-eposta').value.trim(), sifre = $('#g-sifre').value;
  g.hata = ''; g.bilgi = '';
  try {
    if (!eposta || !sifre) throw new Error('E-posta ve şifreni yaz.');
    if (uye) {
      const ad = $('#g-ad').value.trim(), tel = $('#g-tel').value.trim();
      if (ad.length < 2) throw new Error('Adını yaz.');
      if (tel.replace(/[^0-9]/g, '').length < 10) throw new Error('Telefon numaranı kontrol et.');
      if (sifre.length < 8) throw new Error('Şifre en az 8 karakter olmalı.');
      const { data, error } = await db.auth.signUp({ email: eposta, password: sifre, options: { data: { rol: g.rol, ad: ad, telefon: tel } } });
      if (error) throw new Error(cevir(error.message));
      if (!data.session) {
        g.mod = 'giris';
        g.bilgi = 'Üyeliğin oluşturuldu. E-postana gelen onay bağlantısına dokun, sonra buradan giriş yap.';
        return ciz();
      }
      S.session = data.session;
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email: eposta, password: sifre });
      if (error) throw new Error(cevir(error.message));
      S.session = data.session;
    }
    await yukle();
  } catch (e) {
    g.hata = e.message; ciz();
  }
}
async function cikis() {
  dur();
  await db.auth.signOut();
  Object.assign(S, { session: null, profil: null, kafe: null, talep: null, teklifler: [], kod: null, karsi: null, sekme: 'talepler' });
  S.giris = { mod: 'giris', rol: 'musteri', hata: '', bilgi: '' };
  git('giris');
}

/* ---------- açılış ---------- */
async function yukle() {
  if (!S.session) return git('giris');
  S.profil = await q(db.from('profiles').select('*').eq('id', uid()).maybeSingle());
  if (!S.profil) { await db.auth.signOut(); S.session = null; S.giris.hata = 'Hesap bilgilerin bulunamadı. Tekrar üye olmayı dene.'; return git('giris'); }
  if (S.profil.rol === 'isletme') {
    S.kafe = await q(db.from('kafeler').select('*').eq('sahip', uid()).maybeSingle());
    return git(!S.kafe ? 'basvuru' : (S.kafe.onayli ? 'panel' : 'bekleme'));
  }
  S.kod = await q(db.rpc('son_kodum'));
  if (S.kod && (S.kod.durum === 'aktif' || (S.kod.durum === 'kullanildi' && !S.kod.musteri_onay))) return git('kod');
  const acik = await q(db.from('talepler').select('*').eq('musteri', uid()).eq('durum', 'acik').gt('bitis', new Date().toISOString()).order('created_at', { ascending: false }).limit(1));
  if (acik.length) { S.talep = acik[0]; return git('teklifler'); }
  git('talep');
}

function teklifCiz(talep) {
  const bitti = new Date(talep.bitis).getTime() <= Date.now();
  const l = S.teklifler;
  const baslik = $('#teklif-baslik'), sure = $('#teklif-sure'), liste = $('#teklif-liste');
  if (!baslik) return;
  baslik.textContent = l.length ? l.length + ' kafe teklif verdi' : (bitti ? 'Teklif gelmedi' : 'Teklifler bekleniyor');
  sure.textContent = bitti ? 'Talebinin süresi doldu.' : 'Talebin ' + kalanDk(talep.bitis) + ' dakika daha açık.';
  const imza = JSON.stringify(l) + bitti;
  if (imza === S.teklifImza) return;
  S.teklifImza = imza;
  if (!l.length) {
    liste.innerHTML = '<div class="kart kesik"><p class="soluk">' + (bitti ? 'Bu sefer kimse teklif vermedi. Farklı bir oranla tekrar deneyebilirsin.' : 'Çevrendeki kafelere haber verildi. Teklifler geldikçe burada görünür.') + '</p></div>' +
      (bitti ? '<button type="button" class="btn ana tam" data-a="talep-iptal">Yeni talep oluştur</button>' : '');
  } else {
    liste.innerHTML = l.map((x) => {
      const k = x.kafe || {};
      const etiket = x.tur === 'karsi' ? 'Karşı teklif: ' + x.kapsam : 'İstediğin indirimi kabul etti';
      return '<div class="kart satir" style="align-items:center;gap:12px">' +
        '<div class="oran-kutu">%' + Number(x.oran) + '</div>' +
        '<div class="sutun buyu" style="gap:2px"><span style="font-weight:600">' + esc(k.ad) + '</span>' +
          '<span class="soluk kucuk">' + esc(mesafeYazi(mesafe(talep.lat, talep.lng, k.lat, k.lng))) + '</span>' +
          '<span class="yesil-yazi kucuk">' + esc(etiket) + '</span>' +
          '<span class="soluk kucuk">' + (k.alt_sinir > 0 ? 'En az ' + esc(tl(k.alt_sinir)) + ' hesapta geçerli' : 'Hesap alt sınırı yok') + '</span>' +
          '<button type="button" class="yazi-btn" style="align-self:flex-start;padding:0" data-a="menu-ac" data-v="' + esc(x.id) + '">Menü ve fiyatlar</button></div>' +
        '<button type="button" class="btn ana dar" data-a="teklif-sec" data-v="' + esc(x.id) + '">Seç</button></div>';
    }).join('');
  }
  if (katman) {
    katman.clearLayers();
    L.marker([talep.lat, talep.lng], { icon: benIkon(), keyboard: false }).addTo(katman);
    const noktalar = [[talep.lat, talep.lng]];
    l.forEach((x) => { if (x.kafe) { L.marker([x.kafe.lat, x.kafe.lng], { icon: oranIkon(x.oran), title: x.kafe.ad, keyboard: false }).addTo(katman); noktalar.push([x.kafe.lat, x.kafe.lng]); } });
    if (noktalar.length > 1) map.fitBounds(noktalar, { padding: [36, 36], maxZoom: 16 });
  }
}

      '<p class="soluk kucuk">Alkollü içecekler hiçbir teklife dahil değildir.</p>' +
      '<div class="izgara" style="grid-template-columns:1fr 1fr;margin-top:auto"><button type="button" class="btn" data-a="karsi-vazgec">Vazgeç</button>' +
        '<button type="button" class="btn ana" data-a="karsi-gonder">Teklifi gönder</button></div>';
    return;
  }
  el.innerHTML =
    '<form id="kod-form" class="kart sutun" novalidate><label for="kod-giris">Müşterinin kodunu onayla</label>' +
      '<div class="satir"><input id="kod-giris" class="buyu" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="8" placeholder="Örnek: K7M42Q" style="font-family:var(--baslik);font-weight:700;letter-spacing:.1em;text-transform:uppercase">' +
      '<button type="submit" class="btn yesil dar">Onayla</button></div>' +
      '<p id="kod-sonuc" class="kucuk" role="status">' + (S.kodSonuc ? esc(S.kodSonuc) : '') + '</p></form>' +
    '<div class="sutun" style="gap:4px"><h3>Yakındaki talepler</h3><p class="soluk kucuk">1,5 km çevrendeki açık talepler. Liste kendiliğinden yenilenir.</p></div>' +
    '<div id="talep-liste" class="sutun"><p class="soluk">Yükleniyor…</p></div>';
  $('#kod-form').addEventListener('submit', (e) => { e.preventDefault(); calistir(kodOnayla, e.submitter); });
  S.talepImza = null;
  tekrarla(async (gecerli) => {
    const simdi = new Date().toISOString();
    const [talepler, teklifler] = await Promise.all([
      q(db.from('talepler').select('id,kisi,kapsam,oran,lat,lng,durum,bitis,created_at').eq('durum', 'acik').gt('bitis', simdi).order('created_at', { ascending: false })),
      q(db.from('teklifler').select('id,talep_id,kapsam,oran,tur,durum').eq('kafe_id', S.kafe.id).order('created_at', { ascending: false }).limit(60))
    ]);
    if (!gecerli() || S.view !== 'panel' || S.sekme !== 'talepler' || S.karsi) return;
    S.acikTalepler = talepler;
    const benim = {}; teklifler.forEach((f) => { benim[f.talep_id] = f; });
    const liste = $('#talep-liste'); if (!liste) return;
    const imza = JSON.stringify([talepler.map((t) => [t.id, kalanDk(t.bitis)]), teklifler.map((f) => [f.id, f.oran, f.kapsam, f.durum])]);
    if (imza === S.talepImza) return;
    S.talepImza = imza;
    if (!talepler.length) { liste.innerHTML = '<div class="kart kesik"><p class="soluk">Şu an açık talep yok. Yeni talep gelince burada görünür.</p></div>'; return; }
    liste.innerHTML = talepler.map((t) => {
      const f = benim[t.id];
      const alt = f
        ? '<p class="yesil-yazi" style="font-size:14px">' + esc((f.tur === 'karsi' ? 'Karşı teklifin: ' : f.tur === 'otomatik' ? 'Otomatik kabul edildi: ' : 'Kabul ettin: ') + f.kapsam + ' için %' + f.oran) + '</p>' +
          '<button type="button" class="btn dar" data-a="karsi-ac" data-v="' + esc(t.id) + '">Teklifi değiştir</button>'
        : '<div class="izgara" style="grid-template-columns:1fr 1fr"><button type="button" class="btn yesil dar" data-a="talep-kabul" data-v="' + esc(t.id) + '">Kabul et</button>' +
          '<button type="button" class="btn dar" data-a="karsi-ac" data-v="' + esc(t.id) + '">Karşı teklif ver</button></div>';
      return '<div class="kart sutun"><div class="satir arasi"><div class="sutun" style="gap:2px"><span style="font-weight:600">' + esc(t.kisi + ' kişi · ' + t.kapsam) + '</span>' +
        '<span class="soluk kucuk">' + esc(Math.round(mesafe(S.kafe.lat, S.kafe.lng, t.lat, t.lng) / 10) * 10 + ' m uzakta · ' + kalanDk(t.bitis) + ' dk kaldı') + '</span></div>' +
        '<span class="oran-yazi">%' + Number(t.oran) + '</span></div>' + alt + '</div>';
    }).join('');
  }, 5000);
};
async function kodOnayla() {
  const giris = $('#kod-giris'), sonuc = $('#kod-sonuc');
  const kod = giris.value.trim();
  if (kod.length < 4) throw new Error('Müşterinin kodunu yaz.');
  try {
    const r = await q(db.rpc('kod_kullan', { p_kod: kod }));
    S.kodSonuc = 'Onaylandı: ' + r.kisi + ' kişi, ' + r.kapsam + ' için %' + r.oran + ' indirim uygula.';
    giris.value = '';
    sonuc.className = 'kucuk yesil-yazi';
  } catch (e) {
    S.kodSonuc = e.message;
    sonuc.className = 'kucuk hata-yazi';
  }
  sonuc.textContent = S.kodSonuc;
}

async function kuralEkle() {
  const bas = $('#r-bas').value, bit = $('#r-bit').value;

  await q(db.from('otomatik_kurallar').insert({
    kafe_id: S.kafe.id, gunler: $('#r-gun').value, baslangic: bas, bitis: bit,
    max_icecek: Number($('#r-icecek').value), max_tatli: Number($('#r-tatli').value), max_yemek: Number($('#r-yemek').value)
  }));
  toast('Saat dilimi eklendi.');
  await SEKME.otomatik();
}

async function yoneticiYukle() {

    q(db.from('kafeler').select('*').order('created_at', { ascending: false })),
    q(db.from('kafe_gizli').select('*')),

      '<div class="satir"><button type="button" class="btn dar ' + (k.onayli ? '' : 'yesil') + ' buyu" data-a="kafe-onay" data-v="' + esc(k.id) + '" data-durum="' + (k.onayli ? '1' : '0') + '">' + (k.onayli ? 'Onayı kaldır' : 'Onayla') + '</button>' +
      '<a class="btn dar" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(k.lat + ',' + k.lng) + '">Haritada gör</a></div></div>';
  }).join('');

  },
  'talep-iptal': async () => { if (S.talep) await q(db.rpc('talep_iptal', { p_talep: S.talep.id })); S.talep = null; S.teklifler = []; git('talep'); },
  'menu-ac': (el) => { S.menuTeklif = S.teklifler.find((x) => x.id === el.dataset.v); if (S.menuTeklif) git('menu'); },
  'teklif-sec': async (el) => { await q(db.rpc('teklif_sec', { p_teklif: el.dataset.v })); S.talep = null; S.teklifler = []; git('kod'); },
  'kod-bildir': async () => { await q(db.rpc('musteri_onay', { p_kod_id: S.kod.id, p_puan: null })); S.kod.musteri_onay = true; S.kodImza = null; kodCiz(); },
  'puan': async (el) => { await q(db.rpc('musteri_onay', { p_kod_id: S.kod.id, p_puan: Number(el.dataset.v) })); S.kod.puan = Number(el.dataset.v); S.kod.musteri_onay = true; S.kodImza = null; kodCiz(); toast('Puanın kaydedildi.'); },
  'yeni-talep': async () => { if (S.kod && S.kod.durum === 'kullanildi' && !S.kod.musteri_onay) await q(db.rpc('musteri_onay', { p_kod_id: S.kod.id, p_puan: null })); S.kod = null; git('talep'); },
  'basvuru-konum': async () => { const p = await konumAl(); S.basvuru.lat = p.lat; S.basvuru.lng = p.lng; if (map) map.setView([p.lat, p.lng], 17); basvuruIsaret(); },
  'sekme': (el) => { S.sekme = el.dataset.v; S.karsi = null; ciz(); },
  'talep-kabul': async (el) => {
    const t = (S.acikTalepler || []).find((x) => x.id === el.dataset.v); if (!t) return;

  },
  'karsi-ac': (el) => {
    const t = (S.acikTalepler || []).find((x) => x.id === el.dataset.v); if (!t) return;

  },
  'karsi-vazgec': () => { S.karsi = null; SEKME.talepler(); },
  'karsi-gonder': async () => {

    await q(db.rpc('teklif_ver', { p_talep: k.talep.id, p_kapsam: k.kapsam, p_oran: k.oran }));
    S.karsi = null; toast('Teklifin müşteriye gönderildi.'); SEKME.talepler();
  },
  'kural-ac': async (el) => { await q(db.from('otomatik_kurallar').update({ aktif: el.dataset.durum !== '1' }).eq('id', el.dataset.v)); await SEKME.otomatik(); },
  'kural-sil': async (el) => { await q(db.from('otomatik_kurallar').delete().eq('id', el.dataset.v)); await SEKME.otomatik(); },
  'urun-dahil': async (el) => { await q(db.from('menu_urunleri').update({ indirime_dahil: el.dataset.durum !== '1' }).eq('id', el.dataset.v)); await SEKME.menu(); },
  'urun-sil': async (el) => { await q(db.from('menu_urunleri').delete().eq('id', el.dataset.v)); await SEKME.menu(); },
  'kafe-onay': async (el) => { await q(db.rpc('yonetici_kafe_onay', { p_kafe: el.dataset.v, p_onay: el.dataset.durum !== '1' })); await yoneticiYukle(); }
};
async function calistir(fn, dugme) {
  if (dugme && dugme.disabled) return;
  if (dugme) dugme.disabled = true;
  try { await fn(); } catch (e) { console.warn(e); toast(e && e.message ? e.message : 'Bir sorun oluştu.', true); }
  if (dugme && dugme.isConnected) dugme.disabled = false;
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || !ISLEM[el.dataset.a]) return;
  calistir(() => ISLEM[el.dataset.a](el), el.tagName === 'BUTTON' ? el : null);
});

(async function basla() {
  try {
    const { data } = await db.auth.getSession();
    S.session = data.session;
    await yukle();
  } catch (e) {
    console.warn(e);
    app.innerHTML = '<div class="ic ust-bosluk"><h1>Bağlantı kurulamadı</h1><p class="soluk">' + esc(e.message || '') + '</p><button type="button" class="btn ana" onclick="location.reload()">Tekrar dene</button></div>';
  }
})();
</script>
